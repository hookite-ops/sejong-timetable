<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>세종 시간표 운영자</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#161d19;--sub:#66736b;--line:#e3e8e3;--accent:#1f8a5b;--blue:#1c7ed6;--warn:#a85a14}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--card:#161f28;--ink:#eef2ee;--sub:#93a19a;--line:#24303b;--accent:#3fc489;--blue:#4dabf7;--warn:#f0a35e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;padding:calc(env(safe-area-inset-top) + 16px) 16px 40px}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--sub);font-size:13.5px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 6px}
input,select{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;cursor:pointer;touch-action:manipulation}
button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;padding:8px 12px;font-size:13.5px}
.row{display:flex;gap:8px;align-items:center}
.code{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800;letter-spacing:1px;color:var(--blue);margin:8px 0}
.t{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.t:first-child{border-top:0}
.t div{flex:1;min-width:0}.t b{display:block}.t span{font-size:12.5px;color:var(--sub)}
.off{opacity:.5}
.msg{font-size:13.5px;color:var(--warn);min-height:1em;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>세종 시간표 운영자</h1>
<p class="sub">선생님 코드를 만들어 선생님께 전해 주세요. 코드는 만들 때 한 번만 보여요.</p>

<div class="card" id="keyCard">
  <h2>운영자 키</h2>
  <input id="key" type="password" placeholder="Cloud Run의 ADMIN_KEY" autocomplete="off">
  <div class="row" style="margin-top:10px"><button id="go">확인</button></div>
  <div class="msg" id="kmsg"></div>
</div>

<div id="main" hidden>
  <div class="card">
    <h2>선생님 코드 만들기</h2>
    <label for="q">학교 찾기</label>
    <input id="q" placeholder="학교 이름 (예: 새움중)">
    <select id="school" size="5" style="margin-top:6px"></select>
    <label for="nm">선생님 이름</label>
    <input id="nm" maxlength="10" placeholder="예: 김하늘">
    <div class="row" style="margin-top:12px"><button id="make">코드 만들기</button></div>
    <div id="out" hidden><div class="code" id="code"></div><div class="row"><button class="ghost" id="copy">복사</button><span class="sub" id="outWho"></span></div></div>
    <div class="msg" id="mmsg"></div>
  </div>
  <div class="card">
    <h2>선생님 목록</h2>
    <div id="list"></div>
  </div>
</div>
</main>
<script src="admin.js"></script>
</body>
</html>
