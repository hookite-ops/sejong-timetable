<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세종 시간표</title>
<meta name="description" content="세종시 모든 초·중·고 시간표와 같은 반 교시 메모">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세종 시간표">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f2; --card:#ffffff; --ink:#161d19; --sub:#66736b; --line:#e3e8e3;
  --accent:#1f8a5b; --accent-ink:#ffffff; --soft:#e7f3ec; --warn:#a85a14; --warn-bg:#fbf0e4; --memo:#e8590c; --memo-bg:#fff1e6;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 4px 14px rgba(20,40,30,.05);
  --ts:70%; --tl:93%; --cs:55%; --cl:33%; --ns:52%; --nl:42%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --card:#161f28; --ink:#eef2ee; --sub:#93a19a; --line:#24303b;
  --accent:#3fc489; --accent-ink:#06180f; --soft:#173126; --warn:#f0a35e; --warn-bg:#2b2015; --memo:#ff9d5c; --memo-bg:#33210f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22);
  --ts:30%; --tl:20%; --cs:70%; --cl:80%; --ns:40%; --nl:32%;
}}
:root[data-theme="dark"]{
  --bg:#0e141b; --card:#161f28; --ink:#eef2ee; --sub:#93a19a; --line:#24303b;
  --accent:#3fc489; --accent-ink:#06180f; --soft:#173126; --warn:#f0a35e; --warn-bg:#2b2015; --memo:#ff9d5c; --memo-bg:#33210f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22);
  --ts:30%; --tl:20%; --cs:70%; --cl:80%; --ns:40%; --nl:32%;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea,.memo p{-webkit-user-select:text;user-select:text}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 104px) calc(env(safe-area-inset-left) + 16px);max-width:560px;margin:0 auto;overscroll-behavior-y:contain}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.tint{background:hsl(var(--h,150) calc(var(--s,1) * var(--ts)) var(--tl));color:hsl(var(--h,150) calc(var(--s,1) * var(--cs)) var(--cl))}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:6px 2px 14px}
.brand{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.15;min-width:0}
.brand small{display:block;font-size:14px;font-weight:500;color:var(--sub);letter-spacing:0;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);flex:none;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:active{transform:scale(.97)}

.now{--h:150;--s:1;display:block;width:100%;text-align:left;background:hsl(var(--h) calc(var(--s) * var(--ns)) var(--nl));color:#fff;border-radius:22px;padding:16px 18px 15px;box-shadow:var(--shadow);margin-bottom:14px;transition:background .4s}
.now .top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.now .lbl{font-size:13.5px;opacity:.85;font-weight:500}
.now .subj{font-size:32px;font-weight:700;line-height:1.15;margin-top:2px;letter-spacing:-.5px;word-break:keep-all}
.now .left{text-align:right;flex:none;line-height:1.1}
.now .left b{display:block;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.now .left span{font-size:12.5px;opacity:.85}
.now .meta{font-size:13.5px;opacity:.9;margin-top:6px}
.now .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.now .bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .6s}
.now .next,.now .nmemo{margin-top:11px;font-size:14px;display:flex;align-items:center;gap:8px;opacity:.95}
.now .next:empty,.now .nmemo:empty{display:none}
.now .nmemo{margin-top:8px}
.now .nmemo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.now .next em,.now .nmemo em{font-style:normal;background:rgba(255,255,255,.2);border-radius:7px;padding:2px 8px;font-size:12.5px;font-weight:500;flex:none}
.now.idle{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.now.idle .bar{display:none}
.now.idle .lbl,.now.idle .meta{color:var(--sub);opacity:1}
.now.idle .subj{font-size:24px}
.now.idle .next em{background:var(--soft);color:var(--accent)}
.now.idle .nmemo em{background:var(--memo-bg);color:var(--memo)}
.now.cta{border:2px dashed var(--accent);color:var(--accent)}

.days{display:flex;gap:6px;margin-bottom:12px}
.day{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 0 6px;text-align:center;font-size:12.5px;color:var(--sub);position:relative;min-height:48px}
.day b{display:block;font-size:17px;color:var(--ink);font-weight:700}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.sel b{color:var(--bg)}
.day.today::after{content:'';position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.day .dm{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--memo)}

.list{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:13px;padding:11px 12px 11px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:62px;width:100%;text-align:left}
.row:active{transform:scale(.99)}
.row .p{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.row .s{flex:1;min-width:0}
.row .s b{display:block;font-size:18px;font-weight:700;letter-spacing:-.3px;word-break:keep-all}
.row .s span{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.row .s .mp{display:block;font-size:13px;color:var(--memo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);flex:none}
.row .mc{flex:none;font-size:12px;font-weight:700;color:var(--memo);background:var(--memo-bg);border-radius:999px;padding:4px 9px}
.row .add{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--sub);font-size:18px;line-height:1}
.row.cur{border-color:hsl(var(--h) calc(var(--s) * var(--ns)) var(--nl));border-width:2px;padding:10px 11px 10px 13px;box-shadow:var(--shadow)}
.row.cur .tag{background:hsl(var(--h) calc(var(--s) * var(--ns)) var(--nl));color:#fff}
.row.done{opacity:.5}
.lunch{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sub);padding:2px 6px}
.lunch::before,.lunch::after{content:'';flex:1;height:1px;background:var(--line)}
.empty{padding:36px 16px;text-align:center;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:18px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px;font-weight:700}
.empty button{margin-top:14px;padding:12px 20px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700}

.grid{display:none}
.grid table{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;margin:-4px}
.grid th{font-weight:500;color:var(--sub);font-size:12.5px;padding:2px 0 4px}
.grid th b{display:block;font-size:15px;color:var(--ink)}
.grid th.tod b{color:var(--accent)}
.grid th:first-child,.grid td.n{width:22px}
.grid td{height:52px;border-radius:12px;text-align:center;font-size:14.5px;font-weight:700;letter-spacing:-.3px;word-break:keep-all;line-height:1.15;padding:2px;position:relative;cursor:pointer}
.grid td.n{color:var(--sub);font-weight:500;font-size:13px;cursor:default}
.grid td.blank{background:transparent;cursor:default}
.grid td.cur{outline:2.5px solid var(--ink);outline-offset:-2.5px}
.grid td.past{opacity:.5}
.grid td .mb{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--memo);color:#fff;font-size:10.5px;font-style:normal;line-height:17px;font-weight:700}
.grid .ghint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:10px}
body.week .grid{display:block}
body.week .days,body.week .list{display:none}

.weeknav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font-size:14px;color:var(--sub)}
.weeknav button{width:44px;height:40px;border-radius:12px;font-size:24px;line-height:1;color:var(--ink)}
.weeknav .wk{font-weight:700;color:var(--ink);font-size:15px}
.weeknav .wk em{font-style:normal;color:var(--accent);font-size:12.5px;margin-left:6px;font-weight:500}

.foot{margin-top:14px;margin-bottom:8px;font-size:12.5px;color:var(--sub);text-align:center}
.foot.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:9px 12px;text-align:left}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.16);z-index:5}
.tabbar button{padding:11px 22px;white-space:nowrap;border-radius:999px;font-weight:700;font-size:15px;color:var(--sub)}
.tabbar button.on{background:var(--ink);color:var(--bg)}

.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
.ptr{height:0;overflow:hidden;text-align:center;color:var(--sub);font-size:13px;transition:height .2s}

dialog{border:0;border-radius:24px 24px 0 0;background:var(--card);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;
  padding:18px calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 18px);max-height:90vh;max-height:90dvh;overscroll-behavior:contain}
dialog:not(.tall){overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog.tall{height:90vh;height:90dvh;display:none;flex-direction:column}
dialog.tall[open]{display:flex}
dialog h2{margin:0 0 4px;font-family:'Gowun Dodum',system-ui;font-weight:400;font-size:22px;word-break:keep-all}
dialog p.d{margin:0 0 14px;color:var(--sub);font-size:14px}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.dh small{display:block;color:var(--sub);font-size:13px;margin-bottom:2px}
.x{flex:none;padding:9px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:500}
.sec{font-size:13px;color:var(--sub);margin:16px 0 8px;font-weight:500}
.sec span{font-weight:400}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.pick.g3{grid-template-columns:repeat(3,1fr)}
.pick button{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 4px;font-size:16px;font-weight:500;min-height:48px;line-height:1.2;word-break:keep-all}
.pick button small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.pick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick button.on small{color:var(--accent-ink);opacity:.85}
.pick .note{grid-column:1/-1;font-size:13px;color:var(--sub);padding:6px 2px}
.times{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:center;font-size:14px}
.times input{font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 8px;width:100%;min-height:40px}
.btns{display:flex;gap:8px;margin-top:20px;position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom) + 18px));background:var(--card);padding:10px 0 calc(env(safe-area-inset-bottom) + 18px)}
.btns button{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:16px;background:var(--bg);border:1px solid var(--line)}
.btns button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns button:disabled{opacity:.45}
.keyin{font:inherit;font-size:16px;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;-webkit-appearance:none;appearance:none}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:700}
.schoolRow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left}
.schoolRow b{font-size:17px}
.schoolRow span{color:var(--accent);font-weight:700;font-size:14px;flex:none}

/* 학교 찾기 */
#schoolDlg .seg{margin:10px 0 6px}
.slist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 6px;border-bottom:1px solid var(--line);min-height:58px}
.sitem:active{background:var(--bg)}
.sitem .k{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700}
.sitem .k.e{background:#fff1d6;color:#a35f00}.sitem .k.m{background:#e2f4ea;color:#1f7a4f}.sitem .k.h{background:#e3ebff;color:#2c4fbf}.sitem .k.s,.sitem .k.x{background:#f1e6ff;color:#7140b0}
:root[data-theme="dark"] .sitem .k{filter:brightness(.8) saturate(1.2)}
.sitem .t{flex:1;min-width:0}
.sitem .t b{display:block;font-size:16.5px;font-weight:700}
.sitem .t span{font-size:12.5px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem.on .t b{color:var(--accent)}
.sitem mark{background:none;color:var(--accent)}
.smsg{padding:30px 10px;text-align:center;color:var(--sub)}
.smsg button{margin-top:12px;padding:10px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}

/* 메모 */
.mlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding:4px 0 10px}
.memo{background:var(--memo-bg);border-radius:16px;padding:11px 13px}
.memo p{margin:0;font-size:16px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.memo .mm{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--sub)}
.memo .mm b{color:var(--ink);font-weight:500;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo .mm .sp{flex:1}
.memo .mm button{font-size:12.5px;color:var(--sub);padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-height:32px}
.memo .mm button.arm{background:var(--warn);color:#fff;border-color:var(--warn)}
.memo.mine{background:var(--soft)}
.mempty{margin:auto;text-align:center;color:var(--sub);font-size:14px;padding:24px 8px}
.mempty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.compose{border-top:1px solid var(--line);padding-top:10px}
.compose textarea{font:inherit;font-size:16px;width:100%;resize:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-height:64px;max-height:30vh;display:block}
.compose textarea:focus,.keyin:focus,.compose input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.crow{display:flex;gap:8px;align-items:center;margin-top:8px}
.crow input{font:inherit;font-size:16px;flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.crow .cnt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
.crow .cnt.over{color:var(--warn);font-weight:700}
.crow .send{flex:none;padding:12px 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:46px}
.crow .send:disabled{opacity:.45}
.hint{margin:8px 2px 0;font-size:12px;color:var(--sub)}

.toast{position:fixed;margin:0;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.top{bottom:auto;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-20px)}
.toast.top.on{transform:translate(-50%,0)}
.now .fix{display:inline-block;font-size:12.5px;font-weight:700;line-height:1.3;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.22);text-align:center;cursor:pointer}
.now.idle .fix{background:var(--soft);color:var(--accent)}
.okt{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:14.5px;text-align:left;min-height:48px}
.okt i{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal}
.okt.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.okt.on i{background:var(--accent);border-color:var(--accent)}
.okt.on i::after{content:'✓';color:var(--accent-ink);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>
<div class="ptr" id="ptr"></div>
<header>
  <div class="brand"><small id="sub">세종 시간표</small><span id="dateLbl">시간표</span></div>
  <button class="chip" id="classBtn">학교 선택</button>
</header>

<div class="now idle" id="now" role="button" tabindex="0">
  <div class="top">
    <div><div class="lbl" id="nowLbl">&nbsp;</div><div class="subj" id="nowSubj">&nbsp;</div></div>
    <div class="left" id="nowLeft"></div>
  </div>
  <div class="meta" id="nowMeta"></div>
  <div class="bar"><i id="nowBar" style="width:0"></i></div>
  <div class="next" id="nowNext"></div>
  <div class="nmemo" id="nowMemo"></div>
</div>

<div class="weeknav">
  <button id="prevW" aria-label="이전 주">‹</button>
  <span class="wk" id="wkLbl">이번 주</span>
  <button id="nextW" aria-label="다음 주">›</button>
</div>

<div class="days" id="days"></div>
<div class="list" id="list"></div>
<div class="grid" id="grid"></div>
<div class="foot" id="foot"></div>

<nav class="tabbar">
  <button id="tDay" class="on">하루</button>
  <button id="tWeek">한 주</button>
  <button id="tSet">설정</button>
</nav>

<!-- 학교 찾기 -->
<dialog id="schoolDlg" class="tall" aria-labelledby="schoolTitle">
  <div class="dh"><div><h2 id="schoolTitle">우리 학교 찾기</h2></div><button class="x" id="schoolClose">닫기</button></div>
  <input type="search" id="schoolQ" class="keyin" placeholder="학교 이름 (예: 새움중, 도담초, ㅅㅇ)" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="학교 이름 검색">
  <div class="seg" id="kindSeg"><button data-k="" class="on">전체</button><button data-k="e">초등</button><button data-k="m">중학</button><button data-k="h">고등</button><button data-k="o">특수·기타</button></div>
  <div class="slist" id="schoolList"></div>
</dialog>

<!-- 설정 -->
<dialog id="dlg" aria-labelledby="setTitle">
  <h2 id="setTitle">우리 반 선택</h2>
  <p class="d" id="setDesc">한 번만 고르면 다음부터 바로 열려요.</p>
  <div class="sec">학교</div>
  <button class="schoolRow" id="schoolRow"><b id="setSchool">학교를 골라 주세요</b><span>바꾸기 ›</span></button>
  <div id="crseWrap" hidden><div class="sec">과정</div><div class="seg" id="crsePick"></div></div>
  <div class="sec">학년</div>
  <div class="pick g3" id="gPick"></div>
  <div class="sec">반 <span id="clsNote"></span></div>
  <div class="pick" id="cPick"></div>
  <div class="sec" id="timeSec">교시 시간 <span id="timeNote"></span></div>
  <div class="times" id="times"></div>
  <button class="okt" id="timesOk" aria-pressed="false"><i aria-hidden="true"></i>이 시간이 우리 학교 일과표와 같아요</button>
  <div class="sec">화면</div>
  <div class="seg" id="theme">
    <button data-v="auto">자동</button><button data-v="light">밝게</button><button data-v="dark">어둡게</button>
  </div>
  <div class="btns"><button id="resetT">시간 기본값</button><button class="pri" id="save">저장</button></div>
</dialog>

<!-- 교시 메모 -->
<dialog id="memoDlg" class="tall" aria-labelledby="mSubj">
  <div class="dh"><div><small id="mWhen"></small><h2 id="mSubj"></h2></div><button class="x" id="memoClose">닫기</button></div>
  <div class="mlist" id="mList"></div>
  <div class="compose">
    <textarea id="mText" maxlength="200" rows="2" placeholder="예: 수행평가 준비물: 색연필" aria-label="메모 내용" enterkeyhint="send"></textarea>
    <div class="crow">
      <input id="mNick" maxlength="12" placeholder="닉네임 (안 써도 돼요)" autocomplete="nickname" aria-label="닉네임">
      <span class="cnt" id="mCount">0/200</span>
      <button class="send" id="mSend">올리기</button>
    </div>
    <p class="hint">같은 반 시간표를 보는 모두에게 보여요 · 욕설·전화번호·링크는 가려져요 · 신고 3번이면 숨겨져요</p>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
